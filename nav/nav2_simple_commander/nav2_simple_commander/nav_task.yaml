# Task Definitions
tasks:
  forward_task:
    task_type: "go_through_pose"
    description: "patrol task - visit all navigation sites in order"
    pose_sequence:
      - "pose_1"
      - "pose_2"
      - "pose_3"
    loop: false  # whether to loop
  
  backward_task:
    task_type: "go_through_pose"
    description: "patrol task - visit all navigation sites in order"
    pose_sequence:
      - "pose_3"
      - "pose_2"
      - "pose_1"
    loop: false  # whether to loop

  go_to_start_task:
    task_type: "go_to_pose"
    description: "go to start pose"
    pose_sequence:
      - "pose_1"
    loop: false

  go_to_dock_task:
    task_type: "go_to_pose"
    description: "go to dock pose"
    pose_sequence:
      - "pose_2"
    loop: false

  go_to_end_task:
    task_type: "go_to_pose"
    description: "go to end pose"
    pose_sequence:
      - "pose_3"
    loop: false